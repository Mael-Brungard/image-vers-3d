# Serveur de licences + HTTPS automatique (Caddy). Voir docs/SERVER.md.
#     cp server/.env.example server/.env   puis remplir server/.env
#     docker compose -f server/docker-compose.yml up -d --build
name: image-vers-3d-licences

services:
  licences:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      I3D_TRUST_PROXY: "1"          # Caddy est le seul à pouvoir joindre le serveur : son en-tête X-Forwarded-For est fiable
      I3D_DB_PATH: /data/licenses.db
    volumes:
      - donnees:/data              # base SQLite : À SAUVEGARDER (voir docs/SERVER.md)
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - licences
    ports:
      - "80:80"
      - "443:443"
    environment:
      I3D_DOMAIN: ${I3D_DOMAIN:?Renseigne I3D_DOMAIN dans server/.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  donnees:
  caddy_data:
  caddy_config:
