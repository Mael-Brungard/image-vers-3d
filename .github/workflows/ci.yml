name: CI

# Tests à chaque modification : Linux et Windows, moteur d'IA simulé (aucune carte graphique nécessaire).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/main.in

      - name: Bibliothèques système pour Qt hors écran (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Installer le logiciel et les outils de test
        run: python -m pip install -e ".[dev]"

      - name: Analyse du code (ruff)
        run: ruff check .

      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
